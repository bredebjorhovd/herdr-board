[package]
name = "herdr-board"
version = "0.1.0"
edition = "2024"

[lib]
name = "herdr_board"
path = "src/lib.rs"

[[bin]]
name = "herdr-board"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
dotenvy = "0.15.7"
libc = "0.2.189"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "blocking", "json", "http2", "charset"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"

[dev-dependencies]
toml = "1.1.3"
