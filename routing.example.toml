# Copy to the plugin config dir and edit:
#   cp routing.example.toml "$(herdr plugin config-dir board)/routing.toml"

[sync]
# How often syncd polls. Floors at 5s.
interval = "30s"
# Linear labels that mean "dispatchable". Issues assigned to you are always
# included; these labels widen that set.
labels = ["herd"]

# First matching route wins. All keys given in `match` must match (AND).
# Available keys: linear_team, linear_project, gh_repo, label.
[[route]]
match = { linear_team = "OFF" }
workspace = "offhand"          # a herdr workspace LABEL (see `herdr workspace list`)
repo = "~/code/offhand"        # the git repo worktrees are cut from
runtime = "claude-code"        # display name; mapped to herdr kind `claude`
prompt = """
You are working on: {title} ({identifier})

{body}

Work in this worktree. Open a PR when done; branch {branch} is prepared.
"""

[[route]]
match = { label = "fintech" }
workspace = "fintech"
repo = "~/code/tripletex-int"
runtime = "claude-code"

# `runtime` is not decoration. Anything `config::herdr_kind_for_runtime` maps is
# dispatchable — `codex` and `opencode` alongside `claude-code` — and all three
# have been exercised end to end (AGE-26), including the part that matters:
# herdr reports them `working`, so their attempts settle on commits and do not
# need a PR to leave `working`. `doctor` rejects a runtime it cannot map rather
# than failing at dispatch time.
#
# `match` ANDs its keys, so one repo can route to different runtimes by label.
[[route]]
match = { gh_repo = "you/scratch", label = "codex" }
workspace = "scratch"
repo = "~/code/scratch"
runtime = "codex"

# Every runtime needs the board conventions in its global instruction file, or a
# dispatched agent has the CLI on PATH and no idea what it is for:
#
#   herdr-board integration install-conventions
#
# Claude Code's copy is the skill at ~/.claude/skills/board/SKILL.md instead.

# A route with no `match` is a catch-all and must come last.

[defaults]
max_concurrent_per_workspace = 3
# `{identifier_lower}` is the identifier made branch-safe: `LIN-145` →
# `lin-145`. For GitHub it also carries the repo — `gh#2` in tripletex-mcp is
# `gh-2-tripletex-mcp` — because GitHub numbers issues per repository, and every
# watched repo's issue 2 sharing one branch name is how another repo's merged
# pull request ends up attached to an untouched task.
branch_template = "board/{identifier_lower}"
# Which way panes split — the board's own and dispatched agents' alike.
# "auto" (default): right into a tab with one pane, down once it holds two or
# more, so a busy tab does not become a row of narrow columns.
# split_direction = "auto"
# Panes besides the board a tab may hold before the next agent opens a tab. Too
# high and the column is unreadable slivers; too low and agents land in tabs,
# which are easy to miss. The default of 3 is your own pane plus two agents.
# max_panes_per_tab = 3
# Raise a herdr notification when released work settles. A conversational
# orchestrator cannot be woken, so somebody has to notice — this is how you do,
# without watching the board.
# notify = true
# When an agent's turn dies on an Anthropic 5xx and its pane stops moving, prompt
# it to carry on rather than leaving it parked on a concurrency slot. Three tries
# with a wait between them, into the pane it is already in — never a re-dispatch,
# since the session is intact and only one turn died — and then it stays blocked
# and says so. Off, because a board that types into panes unprompted is a
# different thing from one that watches them, and because anything else retrying
# these agents wants only one of you doing it.
# nudge_stalled = true
# Which tracker `herdr-board new` writes to: "linear" or "github". This is not
# inferable — a label routes work to a repo and says nothing about where that
# project's tickets live. herdr-board's own backlog is in Linear while its code
# is on GitHub; a repo whose issues you already keep on GitHub is the reverse.
# new_source = "linear"

[linear]
# Which workflow state means "finished, waiting on a human". When the board
# derives `review`, the issue moves there — otherwise dispatch leaves it at
# In Progress and nothing moves it again until the PR merges, so anyone reading
# Linear rather than the board sees In Progress for the whole review window.
#
# A name, not a type, and unavoidably so: `In Review` and `In Progress` are both
# `type: started`, so the API cannot be asked which one means review. Every other
# state the board touches is resolved by type. Unset (the default) means no
# transition at all, which is right if your workflow has no such state.
# `herdr-board doctor` checks the name resolves in each team you route to.
# review_state = "In Review"

# GitHub is entirely optional. With no repos listed it is never polled, the
# header omits it, and GITHUB_TOKEN is not needed at all.
[github]
repos = []
# The fallback filter, not the law — an empty list means every open issue.
# Repos want different answers here: a curated tracker is right to say
# "everything", while a repo that keeps its roadmap as open issues would put
# its whole backlog on the board. Override per repo below.
labels = ["herd"]
# Show open pull requests as their own `review` rows — work waiting on you that
# nobody dispatched. A PR from a board dispatch attaches to its task instead.
pull_requests = true
# Leave the same trail on GitHub that Linear gets: a comment on dispatch and on
# outcome, and close the issue on done. Needs a token with `repo` scope.
# Off by default: the board should not start writing to your issues just
# because you pointed it at a repo.
#
# The fallback, not the law — repos differ here more than anything else does. A
# comment on a project of your own is provenance nobody minds; the same comment
# on a production repo lands on an issue other people read. Override per repo
# below, and `doctor` names the repos it will write to.
writeback = false
# Deliver review comments back into the pane that wrote the pull request.
#
# A task in `review` keeps its pane, so the agent that wrote the PR is still
# sitting there with the whole task in context — and a review is a notification
# it has no way to receive. This wakes it with the comment, the PR url, and for
# an inline comment the file and line. Issue comments, inline comments and
# review submissions all count; `changes requested` is the loudest and is not an
# issue comment at all.
#
# On by default, unlike `writeback`: this writes nothing to anybody's repository,
# it types into a pane of your own. Comments only reach an agent that is idle,
# never one mid-turn, and each is delivered once.
deliver_reviews = true

# One repo, answering differently from the list above. `name` must also appear
# in `repos` — a table naming anything else is settings that apply to nothing,
# and `doctor` refuses it rather than letting it sit there looking effective.
#
# Omit `labels` to fall back to `[github] labels`; `labels = []` is every open
# issue, said out loud. Omit `writeback` to fall back to `[github] writeback`.
# The board writes one of these for you when you adopt a repo and pick labels on
# the way in.
#
# [[github.repo]]
# name = "bredebjorhovd/itsm-agent"
# labels = ["release-a"]
#
# The repo you turned the global flag off for. With `writeback = true` above,
# the board comments and closes everywhere except here — which is the whole
# reason the flag is per repo: one global answer gets set by its riskiest repo,
# so it stays off and the board can close nothing anywhere.
#
# [[github.repo]]
# name = "Florin-AS/Tally"
# writeback = false

# The board lists git repos that have a herdr workspace but no config here, in
# an UNADOPTED section: `a` writes the route and the [github] repos entry, `X`
# adds the repo below. Ignoring is needed because you open a pane in plenty of
# repos you are only reading — another org's, a dependency, something you
# cloned to look at. Delete a line to be offered that repo again.
[adopt]
ignore = []
